<style>
.hh-form{display:grid;gap:18px}
.hh-prev{position:relative;overflow:hidden;border-radius:14px;background:#062f73 center/cover no-repeat;color:#fff;min-height:220px;display:flex;align-items:center;padding:26px}
.hh-prev .hh-copy{position:relative;z-index:1;max-width:660px}
.hh-prev h2{margin:0;font:800 27px/1.15 Poppins,Inter,sans-serif;letter-spacing:-.02em}
.hh-prev .hh-sub{margin:6px 0 0;font:italic 600 18px/1.3 Georgia,serif}
.hh-prev .hh-desc{margin:10px 0 0;color:#eef4ff;font-size:13.5px;max-width:520px}
.hh-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hh-b1,.hh-b2{display:inline-flex;align-items:center;padding:9px 16px;border-radius:14px;font-size:12.5px;font-weight:600}
.hh-b1{background:#ff941f;color:#fff}
.hh-b2{background:#062f73b8;border:1px solid #fff;color:#fff}
.hh-thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.hh-thumb{aspect-ratio:16/9;border-radius:10px;border:1px solid #dbe5f3;background:#eef2f9 center/cover no-repeat;display:grid;place-items:center;color:#8496ad;font-size:11px;min-width:0}
.hh-thumb span{padding:0 6px;text-align:center}
.hh-hint{color:var(--mut);font-size:12.5px;margin:8px 0 0;line-height:1.55}
.hh-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #ffe0b8;border-radius:10px;background:#fff8ee;color:#8a5a12;font-size:12.5px;line-height:1.6}
@media(max-width:760px){.hh-prev{padding:18px;min-height:190px}.hh-prev h2{font-size:21px}.hh-prev .hh-sub{font-size:15px}}
.hh-up{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.hh-upnote{color:var(--mut);font-size:12px}
.hh-up .btn{min-height:36px;padding:0 14px;font-size:12.5px}
html[data-theme=dark] .hh-thumb{background-color:#10173a;border-color:#2a3558;color:#9aa8d0}
</style>
<script>
/* Homepage hero editor — reads and writes the public homepage banner through
   getHomepageHero / saveHomepageHero in Public.gs. No layout code is changed here:
   only the headline, tagline, description, button labels/links and three images. */
function homepageHeroPage() {
  if (typeof SYS === 'function' && !SYS()) return toast('Homepage settings are for the main administrator.', 'warn');
  head('Homepage Hero', 'Edit the public homepage banner, buttons and carousel images');
  $('view').innerHTML = '<div class="card"><div class="aemp">Loading homepage settings&hellip;</div></div>';
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) {
        $('view').innerHTML = '<div class="card"><div class="aemp">' + esc((r && r.error) || 'Could not load the homepage settings.') + '</div></div>';
        return;
      }
      hhRender(r.data || {});
    })
    .withFailureHandler(function (e) {
      $('view').innerHTML = '<div class="card"><div class="aemp">' + esc(e.message || 'Could not load the homepage settings.') + '</div></div>';
    })
    .getHomepageHero();
}

function hhField(id, label, value, max, wide, hint, upload) {
  return '<div class="f"' + (wide ? ' style="grid-column:1/-1"' : '') + '><label for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" value="' + esc(value || '') + '" maxlength="' + max + '" oninput="hhPreview()">' +
    (hint ? '<p class="hh-hint">' + hint + '</p>' : '') +
    (upload ? hhUploadBtn(id, 'hhPreview') : '') + '</div>';
}

/* Upload button + hidden file input for a photo field. */
function hhUploadBtn(fieldId, previewFn) {
  var fileId = fieldId + 'File';
  return '<div class="hh-up"><button type="button" class="btn alt" data-upfor="' + fieldId + '" ' +
    'onclick="document.getElementById(\'' + fileId + '\').click()">Upload photo</button>' +
    '<span class="hh-upnote">or paste a link above</span>' +
    '<input type="file" id="' + fileId + '" accept="image/*" hidden ' +
    'onchange="homepageUploadPhoto(this.files[0],\'' + fieldId + '\',\'' + (previewFn || '') + '\');this.value=\'\'"></div>';
}

/* Resizes the chosen photo in the browser (same routine as the gallery) and stores it in Drive.
   The returned Drive link is written into the field, so Save publishes it like any pasted link. */
function homepageUploadPhoto(file, fieldId, previewFn) {
  if (!file) return;
  var btn = document.querySelector('[data-upfor="' + fieldId + '"]'), label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Uploading\u2026'; }
  var done = function (msg, okFlag) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    if (msg) toast(msg, okFlag === false ? false : undefined);
  };
  wpShrink(file).then(function (dataUrl) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(function (r) {
        if (!r || !r.success) reject(new Error((r && r.error) || 'The photo was not uploaded.'));
        else resolve(r.data);
      }).withFailureHandler(function (e) { reject(e); }).uploadHomepagePhoto(S.token, dataUrl);
    });
  }).then(function (url) {
    var el = document.getElementById(fieldId);
    if (el) { el.value = url; el.dispatchEvent(new Event('input')); }
    if (previewFn && typeof window[previewFn] === 'function') window[previewFn]();
    done('Photo uploaded. Save to publish it.');
  }).catch(function (e) {
    done(e && e.message ? e.message : 'The photo was not uploaded.', false);
  });
}

function hhRender(h) {
  var img = function (i) { return (h.images && h.images[i]) || ''; };
  $('view').innerHTML =
    '<div class="sbar">' +
      '<button type="button" class="btn" id="hhSave" data-act="hhsave">Save &amp; publish</button>' +
      '<button type="button" class="btn alt" data-act="hhreload">Reload saved version</button>' +
      '<button type="button" class="btn alt" data-act="hhview">View homepage</button>' +
    '</div>' +
    '<div class="hh-form">' +
      '<div class="card"><div class="ch"><h3>Preview</h3><span style="color:var(--mut);font-size:13px">As it appears at the top of the homepage</span></div>' +
        '<div class="hh-prev" id="hhBg"><div class="hh-copy">' +
          '<h2 id="hhT"></h2><p class="hh-sub" id="hhS"></p><p class="hh-desc" id="hhD"></p>' +
          '<div class="hh-btns"><span class="hh-b1" id="hhB1"></span><span class="hh-b2" id="hhB2"></span></div>' +
        '</div></div>' +
        '<div class="hh-thumbs">' +
          '<div class="hh-thumb" id="hhThumb1"><span>Slide 1</span></div>' +
          '<div class="hh-thumb" id="hhThumb2"><span>Slide 2</span></div>' +
          '<div class="hh-thumb" id="hhThumb3"><span>Slide 3</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="card"><div class="ch"><h3>Welcome banner</h3><span style="color:var(--mut);font-size:13px">Text and calls to action</span></div>' +
        '<div class="g">' +
          hhField('hhHeadline', 'Main headline', h.headline, 100, true) +
          hhField('hhSubheadline', 'Tagline', h.subheadline, 140, true) +
          hhField('hhDescription', 'Description', h.description, 280, true) +
          hhField('hhPrimaryText', 'Primary button label', h.primaryText, 40) +
          hhField('hhPrimaryUrl', 'Primary button link', h.primaryUrl, 1000) +
          hhField('hhSecondaryText', 'Secondary button label', h.secondaryText, 50) +
          hhField('hhSecondaryUrl', 'Secondary button link', h.secondaryUrl, 1000) +
        '</div>' +
        '<p class="hh-hint">Links accept a secure <b>https://</b> address or an internal page such as <b>?page=admissions</b>. Leave a button label blank to keep the default.</p>' +
      '</div>' +
      '<div class="card"><div class="ch"><h3>Carousel images</h3><span style="color:var(--mut);font-size:13px">Three slides &middot; Google Drive hosted</span></div>' +
        '<div class="g">' +
          hhField('hhImg1', 'Slide 1 photo', img(0), 1000, true, '', true) +
          hhField('hhImg2', 'Slide 2 photo', img(1), 1000, true, '', true) +
          hhField('hhImg3', 'Slide 3 photo', img(2), 1000, true, '', true) +
        '</div>' +
        '<p class="hh-hint"><b>Upload photo</b> resizes the picture in your browser and stores it in the school photos folder for you. You can still paste a Google Drive thumbnail link instead, <b>https://drive.google.com/thumbnail?id=FILE_ID&amp;sz=w2000</b>. Leave a box blank to keep that slide&rsquo;s default photo.</p>' +
        '<div class="hh-note" style="margin-top:12px"><b>Publishing</b><span>Saving updates the public homepage immediately. The rest of the page &mdash; the school logos, menu, sections and footer &mdash; stays controlled by the approved homepage template.</span></div>' +
      '</div>' +
    '</div>';
  hhPreview();
}

/* Live preview from the current form values (never saved until Save is pressed). */
function hhPreview() {
  var g = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
  var t = $('hhT'), s = $('hhS'), d = $('hhD'), b1 = $('hhB1'), b2 = $('hhB2'), bg = $('hhBg');
  if (t) t.textContent = g('hhHeadline') || 'Welcome to Moreh Academy';
  if (s) s.textContent = g('hhSubheadline') || 'School of Righteousness and Excellence.';
  if (d) d.textContent = g('hhDescription') || 'Welcome to Moreh Academy. School of Righteousness and Excellence.';
  if (b1) b1.textContent = (g('hhPrimaryText') || 'Enroll Now!') + ' \u2192';
  if (b2) b2.textContent = g('hhSecondaryText') || 'Discover Moreh Academy';
  var first = g('hhImg1').replace(/"/g, '');
  if (bg) bg.style.backgroundImage = first
    ? 'linear-gradient(90deg,#032d70f2 0%,#0646a8d9 55%,#0646a81a 100%),url("' + first + '")'
    : 'linear-gradient(120deg,#06265b,#08449c)';
  [1, 2, 3].forEach(function (i) {
    var th = $('hhThumb' + i), url = g('hhImg' + i).replace(/"/g, '');
    if (!th) return;
    th.style.backgroundImage = url ? 'url("' + url + '")' : '';
    th.firstChild.textContent = url ? '' : 'Slide ' + i;
  });
}

act.hhsave = function () {
  var g = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
  var payload = {
    headline: g('hhHeadline'),
    subheadline: g('hhSubheadline'),
    description: g('hhDescription'),
    primaryText: g('hhPrimaryText'),
    primaryUrl: g('hhPrimaryUrl'),
    secondaryText: g('hhSecondaryText'),
    secondaryUrl: g('hhSecondaryUrl'),
    images: [g('hhImg1'), g('hhImg2'), g('hhImg3')]
  };
  var btn = $('hhSave'), label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) {
        toast((r && r.error) || 'The homepage settings were not saved.', false);
        if (btn) { btn.disabled = false; btn.textContent = label; }
        return;
      }
      toast(r.message || 'Homepage hero settings saved.');
      hhRender(r.data || payload);
    })
    .withFailureHandler(function (e) {
      toast(e.message || 'The homepage settings were not saved.', false);
      if (btn) { btn.disabled = false; btn.textContent = label; }
    })
    .saveHomepageHero(S.token, payload);
};

act.hhreload = function () { homepageHeroPage(); };

act.hhview = function () {
  google.script.run.withSuccessHandler(function (u) {
    if (u) window.open(u, '_top');
    else toast('The homepage address is not available yet.', false);
  }).withFailureHandler(function () {
    toast('The homepage address is not available yet.', false);
  }).getHomeUrl();
};
</script>
